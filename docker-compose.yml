version: '3.8'

services:
  # Omegooo Node.js + Express + Socket.IO App
  app:
    build: .
    container_name: omegooo_app
    restart: always
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin123}
      - PLISIO_API_KEY=${PLISIO_API_KEY:-cSqDM1bVZd6ElQ3pLQCq2vPJsHEbKazEO2wjE2IaZzQtyiL8IduUeAM2s9c_s6fa}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_KEY=${SUPABASE_KEY}
    volumes:
      - ./blogs.json:/app/blogs.json
      - ./contact_messages.json:/app/contact_messages.json
      - ./login_attempts.json:/app/login_attempts.json
      - ./subscriptions.json:/app/subscriptions.json

  # Optional Cloudflare Tunnel Service (Zero Trust)
  # Uncomment and add your Cloudflare Tunnel Token to connect directly
  # cloudflared:
  #   image: cloudflare/cloudflared:latest
  #   container_name: omegooo_cloudflared
  #   restart: always
  #   command: tunnel --no-autoupdate run
  #   environment:
  #     - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
