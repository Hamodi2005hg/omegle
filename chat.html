    .dark{

      --msgYou:#1e88e5;

      --msgSystem:#424242;

    *{margin:0;padding:0;box-sizing:border-box;}

    .logo{

    .logo span{

    }
    .logo .first-letter{
      color:#ff9a00;
      position:relative;
    }
 
    /* Explode/puff animation for first letter */
    @keyframes puff-explode {
      0% { transform: scale(1); }
      20% { transform: scale(1.4); }
      40% { transform: scale(1.2); }
      60% { transform: scale(1.6); opacity: 1; }
      80% { transform: scale(2); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
 
    .puff{
      animation: puff-explode 1s ease-in-out;
    }
 
    .topbar{
      height:60px;display:flex;justify-content:space-between;align-items:center;

    #darkToggle{

      cursor:pointer;margin-right:10px;

    .notify-box{position:relative;margin-right:12px;cursor:pointer;}
    #notifyIcon{font-size:24px;}
    #notifyDot{

    #notifyMenu{

      display:none;max-height:250px;overflow-y:auto;z-index:999;

    .notify-item{padding:10px;border-bottom:1px solid #ddd;font-size:14px;}
    .notify-empty{padding:10px;text-align:center;color:#777;}
 
    .stage{

    .left-col{

    .video-frame{

      border:6px solid var(--border);overflow:hidden;background:#333;
      display:flex;justify-content:center;align-items:center;
    }
    .video-frame.top{height:360px;}
    .video-frame.bottom{height:360px;}
    video{width:100%;height:100%;object-fit:cover;position:relative;z-index:0;}
    .video-label{

    .watermark{

    .spinner{
      position:absolute;width:60px;height:60px;border-radius:50%;
      border:6px solid #fff;border-top-color:transparent;
      animation:spin 1s linear infinite;z-index:20;
    }
    @keyframes spin{from{transform:rotate(0);}to{transform:rotate(360deg);}}
    #micBtn{
      position:absolute;bottom:10px;right:10px;background:var(--blue);

    #reportBtn{

      right:10px;
      background:red;
      color:#fff;
      padding:4px 8px;
      font-size:10px;
      border-radius:6px;
      cursor:pointer;
      border:none;
      z-index:10;

    .chat-area{

    .msg{

    .msg.you{

    .dark .msg.you{
      color:#ffffff; /* White in dark mode */

    .msg.stranger{
      background:var(--msgStranger);
      border:2px solid var(--msgStrangerBorder);
      color:#e65100; /* Dark orange */

    .dark .msg.stranger{
      color:#ffffff; /* White in dark mode */
    }
    .msg.system{
      background:var(--msgSystem);
      align-self:center;
      border:1px solid var(--border);
      color:var(--text);
      font-size:13px;
      padding:8px 16px;
    }
 
    .chat-input-row{
      display:flex;flex-direction:column;gap:8px;padding:10px;
      background:var(--bg);
      border-top:1px solid var(--border);
      position:sticky;bottom:0;left:0;right:0;z-index:50;
    }
    .typing-indicator {
      display: none;
      padding: 6px 10px;
      background: var(--bg);
      border-radius: 6px;
      border: 1px solid #ddd;
      text-align: center;
      font-size: 13px;
      color: var(--blue);
      font-weight: bold;
      margin-bottom: 8px;

    .typing-indicator.active {

    }
    .typing-dot {
      display: inline-block;

      height: 8px;
      background: var(--blue);
      border-radius: 50%;
      margin-right: 8px;
      animation: typingPulse 1.5s infinite;
    }
    @keyframes typingPulse {
      0% { opacity: 0.3; transform: scale(0.8); }
      50% { opacity: 1; transform: scale(1.1); }
      100% { opacity: 0.3; transform: scale(0.8); }
    }
    .dark .typing-indicator {
      border-color: var(--border);
    }
    .input-container{display:flex;gap:8px;}
    #skipBtn{
      background: var(--blue);
      color:#fff;padding:10px 14px;
      border-radius:8px;cursor:pointer;border:none;
    }
    #sendBtn{
      width:42px;height:42px;background:var(--blue);
      color:#fff;border-radius:8px;border:none;cursor:pointer;
    }
    #chatInput{
      flex:1;padding:10px;border:1px solid #ccc;border-radius:8px;
      background:var(--bg);
      color:var(--text);
    }
 
    @media (max-width: 768px){
      #exitBtn { display:none !important; }
      .stage{
        flex-direction:column;padding:8px;overflow-y:auto;
      }
      .left-col{
        width:100%;min-width:unset;gap:8px;position:relative;
      }
      .video-frame.top{
        height:220px;
        border-width:4px;
      }
      .video-frame.bottom{
        position:relative;
        bottom:auto;
        right:auto;
        width:100%;
        height:220px;
        border-width:4px;
        z-index:1;
      }
      #reportBtn{
        left:10px !important;
        right:auto !important;
        bottom:10px !important;
      }
      #micBtn{
        bottom:10px !important;
        right:10px !important;
        transform:none;
      }
      #toggleMessagesBtn{
        width:50px;height:50px;border-radius:50%;
        border:none;background:var(--blue);color:#fff;
        font-size:20px;align-self:center;margin:10px 0;
        cursor:pointer;display:flex;justify-content:center;align-items:center;
      }
      .messages-hidden .right-col{display:none;}
      .messages-hidden .video-frame.top{height:280px;}
      .messages-hidden .video-frame.bottom{
        height:280px;
        width:100%;
        position:relative;
        bottom:auto;
        right:auto;
      }
      .chat-area{
        overflow-y: auto;
        scrollbar-width: thin;
        scrollbar-color: #bbbbbb #f1f1f1;
      }
      .chat-area::-webkit-scrollbar{
        width: 4px;
      }
      .chat-area::-webkit-scrollbar-thumb{
        background: #b5b5b5;
        border-radius: 10px;
      }
      .chat-area::-webkit-scrollbar-track{
        background: #f1f1f1;
      }
    }
    @media (min-width: 769px){
      #toggleMessagesBtn{
        display:none !important;
      }
    }
  </style>

  <script>
    /* Dark mode toggle */
    const darkToggleBtn = document.getElementById("darkToggle");
    darkToggleBtn.onclick = () => {
      document.body.classList.toggle("dark");
      darkToggleBtn.innerText = document.body.classList.contains("dark") ? "☀️" : "🌙";
    };
 
    /* Update button icon on load to match default dark mode */
    darkToggleBtn.innerText = "☀️";
 
    /* Toggle messages on mobile */
    const toggleMessagesBtn = document.getElementById("toggleMessagesBtn");
    toggleMessagesBtn.onclick = () => {
      document.body.classList.toggle("messages-hidden");
      toggleMessagesBtn.innerText =
        document.body.classList.contains("messages-hidden") ? "▲" : "▼";
    };
 
    /* Report button */
    document.getElementById("reportBtn").onclick = () => {
      if(confirm("Are you sure you want to report this user?")) {
        alert("Report submitted successfully.");
      }
    };
 
    /* Typing indicator functions */
    function showTypingIndicator() {
      document.getElementById('typingIndicator').classList.add('active');
    }
    function hideTypingIndicator() {
      document.getElementById('typingIndicator').classList.remove('active');
    }
 
    let typingTimeout;
    const chatInput = document.getElementById('chatInput');
    chatInput.addEventListener('input', () => {
      if (chatInput.value.length > 0) {
        console.log('Sending typing event...');
      }
    });
 
    function simulatePartnerTyping() {
      showTypingIndicator();
      clearTimeout(typingTimeout);
      typingTimeout = setTimeout(() => {
        hideTypingIndicator();
      }, 3000);
    }
 
    chatInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter' && e.shiftKey) {
        simulatePartnerTyping();
      }
    });
  </script>
